  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #f5f0ea;
      --panel: #fffaf6;
      --ink: #4a4540;
      --muted: #8a837a;
      --accent: #7aada0;
      --accent2: #e8a090;
      --line: #e8dfd4;
      --soft: #eef5f2;
      --ddl: #e89a8a;
      --ok: #7aada0;
      --nav-w: 92px;
      --radius: 14px;
      --radius-sm: 8px;
      --shadow: 0 1px 3px rgba(74, 69, 64, 0.06);
      --transition: 0.18s ease;
    }

    html, body {
      height: 100%;
      overflow: hidden;
    }

    html {
      -webkit-text-size-adjust: 100%;
    }

    body {
      min-height: 100%;
      font-family: "Nunito", "ZCOOL XiaoWei", system-ui, sans-serif;
      font-size: 15px;
      line-height: 1.55;
      color: var(--ink);
      background: linear-gradient(160deg, #f5f0ea 0%, #eef5f2 45%, #f8f2ec 100%);
      background-attachment: fixed;
      -webkit-font-smoothing: antialiased;
    }

    /* ── App layout ── */
    #app {
      display: flex;
      flex-direction: row;
      height: 100%;
      height: -webkit-fill-available;
      height: 100dvh;
      max-height: 100dvh;
      overflow: hidden;
      -webkit-tap-highlight-color: transparent;
    }

    #nav {
      position: fixed;
      left: 0;
      top: 0;
      bottom: 0;
      width: var(--nav-w);
      height: 100%;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: stretch;
      padding-top: calc(12px + env(safe-area-inset-top, 0px));
      padding-bottom: calc(12px + env(safe-area-inset-bottom, 0px));
      background: var(--panel);
      border-right: 1px solid var(--line);
      overflow-y: auto;
      overflow-x: hidden;
      z-index: 100;
      -webkit-overflow-scrolling: touch;
      overscroll-behavior: contain;
      flex-shrink: 0;
    }

    #main {
      flex: 1;
      width: calc(100% - var(--nav-w));
      margin-left: var(--nav-w);
      height: 100%;
      min-height: 0;
      padding-top: calc(12px + env(safe-area-inset-top, 0px));
      padding-bottom: calc(16px + env(safe-area-inset-bottom, 0px));
      overflow-y: auto;
      overflow-x: hidden;
      -webkit-overflow-scrolling: touch;
      overscroll-behavior: contain;
    }

    #page {
      padding: 20px 24px 32px;
      max-width: 960px;
      width: 100%;
      box-sizing: border-box;
    }

    /* ── Nav items ── */
    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      width: 100%;
      min-height: 68px;
      padding: 8px 4px;
      border: none;
      background: transparent;
      color: var(--muted);
      cursor: pointer;
      font-family: inherit;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.02em;
      transition: background var(--transition), color var(--transition);
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }

    .nav-item:hover {
      color: var(--ink);
      background: var(--soft);
    }

    .nav-item.active {
      color: var(--accent);
      background: var(--soft);
    }

    .nav-item .fish-ico {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 36px;
      height: 36px;
      flex-shrink: 0;
    }

    .nav-item .fish-ico svg {
      width: 32px;
      height: 32px;
      display: block;
    }

    .nav-item .label {
      line-height: 1.2;
      text-align: center;
      white-space: nowrap;
    }

    /* ── Cards ── */
    .card {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 18px 20px;
      box-shadow: var(--shadow);
    }

    .card + .card { margin-top: 14px; }

    .card h2, .card h3 {
      font-family: "ZCOOL XiaoWei", "Nunito", system-ui, sans-serif;
      font-weight: 400;
      margin-bottom: 10px;
    }

    .card h2 { font-size: 1.25rem; }
    .card h3 { font-size: 1.05rem; color: var(--ink); }

    /* ── Buttons ── */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      min-height: 40px;
      padding: 8px 18px;
      border: none;
      border-radius: var(--radius-sm);
      background: var(--accent);
      color: #fff;
      font-family: inherit;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity var(--transition), transform 0.1s ease;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }

    .btn:hover { opacity: 0.88; }
    .btn:active { transform: scale(0.97); }

    .btn-ghost {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      min-height: 40px;
      padding: 8px 18px;
      border: 1px solid var(--line);
      border-radius: var(--radius-sm);
      background: transparent;
      color: var(--ink);
      font-family: inherit;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: background var(--transition), border-color var(--transition);
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }

    .btn-ghost:hover {
      background: var(--soft);
      border-color: var(--accent);
    }

    .btn-danger {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      min-height: 40px;
      padding: 8px 18px;
      border: none;
      border-radius: var(--radius-sm);
      background: var(--ddl);
      color: #fff;
      font-family: inherit;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity var(--transition);
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }

    .btn-danger:hover { opacity: 0.88; }

    /* ── Form controls ── */
    .input,
    .textarea {
      width: 100%;
      padding: 10px 14px;
      border: 1px solid var(--line);
      border-radius: var(--radius-sm);
      background: #fff;
      color: var(--ink);
      font-family: inherit;
      font-size: 14px;
      transition: border-color var(--transition), box-shadow var(--transition);
    }

    .input:focus,
    .textarea:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(122, 173, 160, 0.18);
    }

    .textarea {
      min-height: 96px;
      resize: vertical;
      line-height: 1.5;
    }

    /* ── Tabs ── */
    .tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 16px;
      border-bottom: 1px solid var(--line);
      padding-bottom: 10px;
    }

    .tab {
      padding: 7px 16px;
      border: none;
      border-radius: 999px;
      background: transparent;
      color: var(--muted);
      font-family: inherit;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: background var(--transition), color var(--transition);
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }

    .tab:hover { color: var(--ink); background: var(--soft); }

    .tab.active {
      background: var(--accent);
      color: #fff;
    }

    /* ── Layout helpers ── */
    .row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px;
    }

    .grid2 {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 14px;
    }

    @media (max-width: 540px) {
      .grid2 { grid-template-columns: 1fr; }
    }

    .muted {
      color: var(--muted);
      font-size: 0.92em;
    }

    /* ── Pill badge ── */
    .pill {
      display: inline-flex;
      align-items: center;
      padding: 3px 10px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 600;
      background: var(--soft);
      color: var(--accent);
      white-space: nowrap;
    }

    .pill.accent2 { background: #fdf0ec; color: var(--accent2); }
    .pill.ddl { background: #fdf0ee; color: var(--ddl); }
    .pill.ok { background: var(--soft); color: var(--ok); }

    /* ── Flash toast ── */
    #flash {
      position: fixed;
      top: calc(16px + env(safe-area-inset-top, 0px));
      left: 50%;
      transform: translateX(-50%);
      z-index: 9999;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }

    #flash .flash {
      padding: 10px 22px;
      border-radius: 999px;
      background: var(--ink);
      color: #fff;
      font-size: 14px;
      font-weight: 600;
      box-shadow: 0 4px 16px rgba(74, 69, 64, 0.18);
      opacity: 0;
      transform: translateY(-8px);
      transition: opacity 0.25s ease, transform 0.25s ease;
    }

    #flash .flash.show {
      opacity: 1;
      transform: translateY(0);
    }

    /* ── DDL badge ── */
    .ddl-badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 2px 8px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 700;
      background: #fdf0ee;
      color: var(--ddl);
      border: 1px solid rgba(232, 154, 138, 0.35);
    }

    /* ── Progress bar ── */
    .progress-bar {
      width: 100%;
      height: 8px;
      border-radius: 999px;
      background: var(--line);
      overflow: hidden;
    }

    .progress-bar .fill {
      height: 100%;
      border-radius: 999px;
      background: linear-gradient(90deg, var(--accent), #9ec8bc);
      transition: width 0.4s ease;
    }

    /* ── Simple table ── */
    table.simple {
      width: 100%;
      border-collapse: collapse;
      font-size: 14px;
    }

    table.simple th,
    table.simple td {
      padding: 10px 12px;
      text-align: left;
      border-bottom: 1px solid var(--line);
    }

    table.simple th {
      font-weight: 700;
      color: var(--muted);
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    table.simple tr:last-child td { border-bottom: none; }

    table.simple tr:hover td { background: var(--soft); }

    .ex-wrap { display: flex; flex-direction: column; gap: 12px; max-width: 960px; }
    .ex-add h3,
    .ex-sync h3,
    .ex-list-card h3 {
      margin: 0 0 10px;
      font-size: 15px;
      font-weight: 700;
    }
    .ex-sync-head {
      display: flex;
      flex-wrap: wrap;
      align-items: flex-start;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 10px;
    }
    .ex-sync-hint { margin: 4px 0 0; font-size: 12px; }
    .ex-table-wrap {
      overflow-x: auto;
      border-radius: 10px;
      border: 1px solid var(--line);
      background: #fff;
    }
    table.ex-table { margin: 0; }
    table.ex-table th,
    table.ex-table td { padding: 11px 14px; vertical-align: middle; }
    table.ex-table thead th {
      background: linear-gradient(180deg, #f7faf8, #f3f6f4);
      border-bottom: 1px solid var(--line);
      text-transform: none;
      letter-spacing: 0;
      font-size: 12px;
      color: #7a837e;
    }
    table.ex-table tbody tr:nth-child(even) td { background: rgba(122, 173, 160, 0.06); }
    table.ex-table tbody tr:hover td { background: rgba(122, 173, 160, 0.12); }
    .ex-type-pill {
      display: inline-block;
      padding: 2px 10px;
      border-radius: 999px;
      background: rgba(126, 184, 168, 0.22);
      color: #3d6b5e;
      font-weight: 700;
      font-size: 13px;
    }
    .ex-mins {
      font-variant-numeric: tabular-nums;
      font-weight: 700;
      white-space: nowrap;
    }
    .ex-note {
      max-width: 220px;
      color: var(--muted);
      font-size: 13px;
    }
    .ex-src {
      font-size: 12px;
      color: var(--muted);
      white-space: nowrap;
    }
    .ex-total { margin: 10px 0 0; font-size: 12px; }
    .wt-card h3 {
      margin: 0 0 10px;
      font-size: 15px;
      font-weight: 700;
    }
    .ex-import-card h3 {
      margin: 0 0 10px;
      font-size: 15px;
      font-weight: 700;
    }
    .ex-import-card .import-block { margin-bottom: 12px; }
    .ex-import-card .ex-sync-hint { margin: 0 0 6px; }

    .per-wrap { display: flex; flex-direction: column; gap: 12px; max-width: 960px; }
    .per-wrap h3 {
      margin: 0 0 10px;
      font-size: 15px;
      font-weight: 700;
    }
    .per-status {
      margin: 10px 0 4px;
      padding: 10px 12px;
      border-radius: 10px;
      background: var(--soft);
      border: 1px solid var(--line);
      font-size: 13px;
    }
    .per-status.is-on {
      background: linear-gradient(160deg, #fdf2f4, #fff8f6);
      border-color: #e8c4c8;
      color: #8a5a5e;
    }
    .per-stats-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin: 10px 0 8px;
    }
    .per-stat {
      padding: 12px 14px;
      border-radius: 12px;
      background: linear-gradient(160deg, #f7faf8, #fffaf6);
      border: 1px solid var(--line);
    }
    .per-stat strong {
      display: inline-block;
      font-size: 28px;
      font-weight: 800;
      color: var(--accent);
      margin: 4px 4px 0 0;
      line-height: 1.1;
    }
    .per-stat-hint { margin: 6px 0 0; font-size: 11px; line-height: 1.4; }
    .per-stat-detail { margin: 0 0 4px; font-size: 12px; }
    @media (max-width: 560px) {
      .per-stats-grid { grid-template-columns: 1fr; }
    }
    .per-pill-on {
      background: rgba(226, 125, 96, 0.2) !important;
      color: #a85a4a !important;
    }
    .per-sym-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin: 8px 0 4px;
    }
    .per-chip {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 5px 10px;
      border-radius: 999px;
      background: #fff;
      border: 1px solid var(--line);
      font-size: 12px;
      cursor: pointer;
      user-select: none;
    }
    .per-chip:has(input:checked) {
      background: rgba(226, 125, 96, 0.15);
      border-color: #e8a090;
      color: #8a4a40;
      font-weight: 700;
    }
    .per-chip input { margin: 0; }
    .per-summary-sec > h3 {
      margin: 4px 0 10px;
      font-size: 15px;
      font-weight: 700;
    }
    .per-cycle-card { margin-bottom: 12px; }
    .per-cycle-head {
      display: flex;
      flex-wrap: wrap;
      align-items: baseline;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 8px;
    }
    .per-cycle-head h4 { margin: 0; font-size: 14px; }
    .per-charts { margin-top: 12px; }
    .per-chart-hint { margin: 4px 0 0; font-size: 11px; }
    .per-wrap .row.mt { margin-top: 8px; }

    /* ── Timeline ── */
    .wt-chart-block {
      margin-top: 14px;
      padding-top: 12px;
      border-top: 1px solid var(--line);
    }
    .wt-chart-block h4 {
      margin: 0 0 8px;
      font-size: 13px;
      font-weight: 700;
      color: var(--muted);
    }
    #wt-line {
      display: block;
      width: 100%;
      max-width: 100%;
      height: auto;
      border-radius: 10px;
      background: linear-gradient(180deg, #f7faf8, #fff);
      border: 1px solid var(--line);
    }

    /* ── Timeline ── */
    .timeline {
      position: relative;
      padding-left: 24px;
    }

    .timeline::before {
      content: "";
      position: absolute;
      left: 7px;
      top: 4px;
      bottom: 4px;
      width: 2px;
      background: var(--line);
      border-radius: 1px;
    }

    .timeline .tl-item {
      position: relative;
      padding-bottom: 18px;
    }

    .timeline .tl-item:last-child { padding-bottom: 0; }

    .timeline .tl-item::before {
      content: "";
      position: absolute;
      left: -20px;
      top: 6px;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--accent);
      border: 2px solid var(--panel);
      box-shadow: 0 0 0 1px var(--line);
    }

    .timeline .tl-time {
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 2px;
    }

    .timeline .tl-body {
      font-size: 14px;
    }

    /* ── Calendar grid (月计划) ── */
    .month-wrap { position: relative; }
    .cal-fish-deco {
      position: relative;
      height: 36px;
      overflow: hidden;
      margin-bottom: 4px;
      pointer-events: none;
    }
    .swim-fish {
      position: absolute;
      top: 4px;
      font-size: 18px;
      opacity: 0.75;
      will-change: transform;
    }
    .swim-fish.f1 { animation: fish-swim 16s linear infinite; top: 2px; }
    .swim-fish.f2 { animation: fish-swim 22s linear infinite reverse; top: 12px; font-size: 15px; animation-delay: -6s; }
    .swim-fish.f3 { animation: fish-swim 19s linear infinite; top: 6px; font-size: 16px; animation-delay: -11s; opacity: 0.55; }
    @keyframes fish-swim {
      0% { transform: translateX(-40px) translateY(0); }
      25% { transform: translateX(25vw) translateY(-4px); }
      50% { transform: translateX(50vw) translateY(3px); }
      75% { transform: translateX(75vw) translateY(-2px); }
      100% { transform: translateX(calc(100% + 80vw)) translateY(0); }
    }
    @media (prefers-reduced-motion: reduce) {
      .swim-fish { animation: none; left: 12%; }
      .swim-fish.f2 { left: 45%; }
      .swim-fish.f3 { left: 72%; }
    }
    .cal-toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 10px;
    }
    .cal-toolbar .cal-head {
      margin: 0;
      font-family: "ZCOOL XiaoWei", "Nunito", sans-serif;
      font-size: 20px;
    }
    .cal-board {
      padding: 12px;
      margin-bottom: 12px;
      background:
        radial-gradient(ellipse at 20% 0%, rgba(122, 173, 160, 0.12), transparent 50%),
        radial-gradient(ellipse at 90% 100%, rgba(232, 160, 144, 0.1), transparent 45%),
        var(--panel);
      overflow: hidden;
    }
    .cal-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 6px;
    }
    .cal-wd {
      text-align: center;
      font-size: 12px;
      font-weight: 700;
      color: var(--muted);
      padding: 4px 0 8px;
    }
    .cal-day {

    .tank-bowl {
      position: relative;
      width: 100%;
      max-width: 280px;

      aspect-ratio: 1 / 1.05;
    }
    .tank-rim {
      position: absolute;
      left: 12%;
      right: 12%;

      height: 10%;
      border-radius: 999px;
      background: linear-gradient(180deg, rgba(255,255,255,0.85), rgba(180,200,195,0.45));
      border: 1px solid rgba(120, 150, 145, 0.35);
      z-index: 3;
      box-shadow: 0 2px 6px rgba(80, 110, 100, 0.12);
    }
    .tank-glass {
      position: absolute;
      inset: 6% 6% 0;
      border-radius: 48% 48% 46% 46% / 38% 38% 58% 58%;
      background: linear-gradient(160deg, rgba(255,255,255,0.55), rgba(200, 220, 215, 0.2));
      border: 2px solid rgba(120, 160, 150, 0.35);
      box-shadow:
        inset 0 0 24px rgba(255,255,255,0.45),
        inset -10px 0 20px rgba(120, 170, 160, 0.12),
        0 10px 24px rgba(80, 120, 110, 0.12);
      overflow: hidden;
    }
    .tank-water {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 82%;
      background:
        radial-gradient(ellipse at 30% 20%, rgba(255,255,255,0.35), transparent 45%),
        linear-gradient(180deg, rgba(155, 205, 195, 0.35), rgba(90, 160, 150, 0.55) 55%, rgba(70, 130, 125, 0.65));
      border-radius: 0 0 46% 46% / 0 0 40% 40%;
      overflow: hidden;
    }
    .tank-sand {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 14%;
      background: linear-gradient(180deg, #e8d9b0, #d4c091);
      border-radius: 0 0 46% 46% / 0 0 50% 50%;
      opacity: 0.85;
    }
    .tank-fish-school {
      position: absolute;
      inset: 0 0 12% 0;
    }
    .tank-empty-hint {
      position: absolute;
      left: 12%;
      right: 12%;
      top: 38%;
      margin: 0;
      text-align: center;
      font-size: 12px;
      color: rgba(255,255,255,0.85);
      text-shadow: 0 1px 2px rgba(40, 70, 65, 0.35);
    }
    .tank-fish {
      position: absolute;
      top: var(--top, 30%);
      left: var(--x1, 10%);
      width: 32px;
      height: 22px;
      z-index: 1;
      animation: tank-cruise var(--dur, 8s) linear var(--delay, 0s) infinite;
      filter: drop-shadow(0 1px 1.5px rgba(40, 70, 65, 0.25));
      will-change: left, transform;
    }
    .tank-fish-bob {
      display: block;
      width: 100%;
      height: 100%;
      animation: tank-bob var(--bob, 2s) ease-in-out calc(var(--delay, 0s) * 0.3) infinite;
      transform-origin: center;
    }
    .tank-fish svg { width: 100%; height: 100%; display: block; overflow: visible; }
    .tank-fish-more {
      position: absolute;
      right: 12%;
      bottom: 18%;
      z-index: 2;
      padding: 2px 8px;
      border-radius: 999px;
      background: rgba(255,255,255,0.7);
      font-size: 11px;
      font-weight: 700;
      color: #3d6b5e;
    }
    @keyframes tank-cruise {
      0% {
        left: var(--x1, 8%);
        transform: scale(var(--scale, 1)) scaleX(1);
      }
      45% {
        left: var(--x2, 70%);
        transform: scale(var(--scale, 1)) scaleX(1);
      }
      50% {
        left: var(--x2, 70%);
        transform: scale(var(--scale, 1)) scaleX(-1);
      }
      95% {
        left: var(--x1, 8%);
        transform: scale(var(--scale, 1)) scaleX(-1);
      }
      100% {
        left: var(--x1, 8%);
        transform: scale(var(--scale, 1)) scaleX(1);
      }
    }
    @keyframes tank-bob {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-7px); }
    }
    .tank-bubble {
      position: absolute;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: rgba(255,255,255,0.55);
      animation: tank-bubble 4s ease-in infinite;
      z-index: 0;
    }
    .tank-bubble.b1 { left: 28%; bottom: 12%; animation-delay: 0s; }
    .tank-bubble.b2 { left: 55%; bottom: 18%; width: 4px; height: 4px; animation-delay: 1.2s; }
    .tank-bubble.b3 { left: 70%; bottom: 10%; width: 5px; height: 5px; animation-delay: 2.1s; }
    @keyframes tank-bubble {
      0% { transform: translateY(0); opacity: 0.2; }
      40% { opacity: 0.7; }
      100% { transform: translateY(-70px); opacity: 0; }
    }
